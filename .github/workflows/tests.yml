name: Tests

on:
  pull_request:
    branches:
      - main
    paths:
      - gh-my
      - includes/*
      - test/*
  push:
    branches:
      - main
    paths:
      - gh-my
      - includes/*
      - test/*

permissions: {}

jobs:
  run-tests:
    timeout-minutes: 2
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        id: harden-runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          disable-sudo: true
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            release-assets.githubusercontent.com:443

      - name: Checkout repository
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: run-helper-tests
        name: Run helper function tests
        shell: bash
        run: |
          bash test/test.sh

  duplicate-check:
    timeout-minutes: 2
    name: Duplicate Function Check
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        id: harden-runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          disable-sudo: true
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            release-assets.githubusercontent.com:443

      - name: Checkout repository
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: check-duplicates
        name: Check duplicate sourced functions
        shell: bash
        run: |
          bash test/check-duplicates.sh
